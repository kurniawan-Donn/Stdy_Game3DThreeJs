<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Rush 3D - Ruang Tamu</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="hud">
    <div class="score-label">Skor</div>
    <div class="score-value" id="score-text">0</div>
    <div class="lives-row">
      <span>Nyawa:</span>
      <span class="lives-hearts" id="lives-text">❤️❤️❤️</span>
    </div>
    <div class="level-row">Level: <span id="level-text">1</span></div>
    <div class="magnet-status" id="magnet-status">Magnet: 5.0s</div>
    <div class="stamina-row">
      <span>Stamina</span>
      <div class="stamina-bar"><div class="stamina-fill" id="stamina-fill"></div></div>
    </div>
    <div class="meow-status" id="meow-status">Q Meong: siap</div>
    <div class="controls-hint">
      WASD: Gerak &bull; Spasi: Lompat &bull; Shift: Lari<br />
      Shift+Spasi: Lompat tinggi &bull; C: Endap &bull; E: Interaksi &bull; Q: Meong
    </div>
  </div>

  <div id="interact-prompt"></div>
  <div id="debug-panel"></div>

  <div id="game-over">
    <div class="modal">
      <h1>Game Over</h1>
      <p>Skor: <span id="final-score">0</span></p>
      <p>High Score: <span id="high-score">0</span></p>
      <button id="restart-btn">Main Lagi</button>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <!-- Three.js versi pinned r128 (0.128.0), build ES module -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
